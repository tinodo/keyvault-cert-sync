name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    name: Tests (Windows PowerShell 5.1)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build the self-contained extension script
        shell: powershell
        run: .\tools\Build-ExtensionScript.ps1

      - name: Agent logic tests
        shell: powershell
        run: .\test\Test-SyncLogic.ps1

      - name: Extension payload tests
        shell: powershell
        run: .\test\Test-ExtensionPayload.ps1

      - name: Installer staging tests
        shell: powershell
        run: .\test\Test-InstallerStaging.ps1

      - name: Upload the built artifact
        uses: actions/upload-artifact@v4
        with:
          name: certsync-extension
          path: dist/certsync-extension.ps1
          if-no-files-found: error

  analyse:
    name: PSScriptAnalyzer
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install PSScriptAnalyzer
        shell: powershell
        run: Install-Module PSScriptAnalyzer -Force -Scope CurrentUser -ErrorAction Stop

      - name: Analyse
        shell: powershell
        run: |
          $results = Invoke-ScriptAnalyzer -Path . -Recurse -Severity Error,Warning `
                       -ExcludeRule PSAvoidUsingWriteHost,PSUseShouldProcessForStateChangingFunctions,PSAvoidUsingPositionalParameters
          if ($results) {
            $results | Format-Table -AutoSize | Out-String -Width 200 | Write-Host
            $errors = @($results | Where-Object Severity -eq 'Error')
            if ($errors) { throw "PSScriptAnalyzer reported $($errors.Count) error(s)." }
            Write-Host "$($results.Count) warning(s), no errors." -ForegroundColor Yellow
          } else {
            Write-Host 'Clean.' -ForegroundColor Green
          }

  secrets:
    name: Secret and PII scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for credentials and environment-identifying values
        run: |
          set -euo pipefail
          fail=0

          # Exclude .git and the files that necessarily contain these patterns as literals:
          # this workflow and the PowerShell scanner. Without that they match themselves and
          # the job fails on every run, which trains everyone to ignore it.
          common=(--binary-files=without-match
                  --exclude-dir=.git
                  --exclude=ci.yml
                  --exclude=Test-NoSensitiveContent.ps1)

          scan() {
            # grep exits 1 when there are no matches, which is the result we want; only a
            # match (exit 0) is a failure. Anything else is a real error worth surfacing.
            local label="$1"; shift
            local out
            if out=$(grep -rInE "${common[@]}" "$@" . 2>/dev/null); then
              echo "::error::${label}"
              echo "$out"
              return 1
            fi
            return 0
          }

          # Credential-shaped literals. The agent authenticates with managed identity and
          # must never carry a secret, so any match here is a genuine problem.
          # Character classes avoid quoting both quote styles in one bracket expression,
          # which silently truncates the class and makes the pattern never match.
          q="['\"]"
          notq="[^'\"]"
          scan "Credential-shaped literal found." \
            -e "ConvertTo-SecureString[[:space:]]+${q}${notq}{8,}" \
            -e "(password|passwd|pwd)[[:space:]]*=[[:space:]]*${q}?${notq}{4,}" \
            -e "client_secret[[:space:]]*=[[:space:]]*${q}?${notq}+" || fail=1

          # Storage SAS tokens, which can leak via a pasted publish command.
          scan "Storage SAS token found." \
            -e "[?&]s(ig|v)=[A-Za-z0-9%+/=]{16,}" || fail=1

          # Bearer tokens and cloud access keys.
          scan "Access token or key found." \
            -e "\b(eyJ[A-Za-z0-9_-]{20,}|gh[pousr]_[A-Za-z0-9]{20,})" \
            -e "\b(AKIA|ASIA)[0-9A-Z]{16}\b" || fail=1

          # Private key blocks. Assembled at runtime so this line cannot match itself.
          marker="-----BEGIN"
          scan "Private key material found." \
            -e "${marker} [A-Z ]*PRIVATE KEY-----" || fail=1

          # Local profile paths, which identify the machine the work was done on.
          scan "Local profile path found." \
            -e "[A-Z]:\\\\Users\\\\[a-z0-9._-]+\\\\" || fail=1

          if [ "$fail" -eq 0 ]; then echo "Clean."; fi
          exit $fail
